<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trunk Sale Tour '26 — J. Cole City Guide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-dot" aria-hidden="true"></div>
        <div>
          <h1 class="header-title">Trunk Sale Tour '26</h1>
          <p class="header-sub">J. Cole &middot; The Fall-Off &middot; February 2026</p>
        </div>
      </div>
      <button id="toggle-list-btn" class="btn-outline" aria-expanded="false" aria-controls="stop-list">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <line x1="1" y1="4" x2="15" y2="4"/>
          <line x1="1" y1="8" x2="15" y2="8"/>
          <line x1="1" y1="12" x2="15" y2="12"/>
        </svg>
        All Stops
      </button>
    </div>
  </header>

  <main id="app">
    <div id="map" role="application" aria-label="Interactive map of J. Cole Trunk Sale Tour stops"></div>

    <!-- Stop List Drawer -->
    <div id="list-overlay" class="overlay" aria-hidden="true"></div>
    <aside id="stop-list" class="panel stop-list-panel" aria-label="Tour stops list" aria-hidden="true">
      <div class="panel-head">
        <span class="panel-head-title">All Stops</span>
        <button id="close-list-btn" class="btn-icon" aria-label="Close stop list">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="1" y1="1" x2="13" y2="13"/>
            <line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <p class="panel-sub">18 confirmed stops &middot; Feb 2026</p>
      <ul id="stop-items" role="list"></ul>
    </aside>

    <!-- City Guide Panel -->
    <aside id="city-guide" class="panel guide-panel" aria-label="City guide" aria-hidden="true">
      <button id="close-guide-btn" class="btn-icon btn-icon-top" aria-label="Close city guide">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="1" y1="1" x2="13" y2="13"/>
          <line x1="13" y1="1" x2="1" y2="13"/>
        </svg>
      </button>
      <div id="guide-content" class="guide-content"></div>
      <div id="guide-nav" class="guide-nav">
        <button id="prev-btn" class="nav-btn" aria-label="Previous stop">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 1 3 7 9 13"/>
          </svg>
          Prev
        </button>
        <span id="stop-indicator" class="stop-indicator" aria-live="polite"></span>
        <button id="next-btn" class="nav-btn" aria-label="Next stop">
          Next
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="5 1 11 7 5 13"/>
          </svg>
        </button>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
