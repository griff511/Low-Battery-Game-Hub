<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trunk Sale Tour '26 — J. Cole City Guide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Landing Screen -->
  <div id="landing" role="dialog" aria-label="Enter the map" aria-modal="true">
    <div class="landing-bg-glow"></div>
    <div class="landing-inner">
      <p class="landing-brand">Low Battery</p>
      <h2 class="landing-title">J. Cole's<br>Trunk Sale Map</h2>
      <div class="landing-scene" aria-hidden="true">
        <div class="civic-wrap">
          <div class="hlight-beam"></div>
          <svg class="civic-svg" viewBox="0 0 200 72" xmlns="http://www.w3.org/2000/svg">
            <!-- ground shadow -->
            <ellipse cx="103" cy="70" rx="84" ry="3" fill="rgba(0,0,0,0.55)"/>
            <!-- body -->
            <path d="M 15,49 L 15,43 Q 18,36 24,36 L 42,36 L 59,25 L 81,19 L 130,19 L 151,21 L 168,32 L 181,36 Q 189,39 190,44 L 190,49 Z"
                  fill="#1c1c1c" stroke="#2c2c2c" stroke-width="1.5"/>
            <!-- windows -->
            <path d="M 63,27 L 81,21 L 130,21 L 149,23 L 165,33 L 153,36 L 69,36 Z"
                  fill="#0b1e30" stroke="#162c40" stroke-width="1"/>
            <!-- B-pillar -->
            <rect x="103" y="21" width="3" height="15" fill="#111"/>
            <!-- headlight -->
            <path d="M 188,38 L 194,40 L 194,46 L 188,45 Z" fill="#F5C518"/>
            <!-- taillight -->
            <rect x="13" y="38" width="3" height="9" rx="1" fill="#7a0000"/>
            <!-- door crease -->
            <path d="M 26,43 Q 103,45 183,42" stroke="#252525" stroke-width="1.5" fill="none"/>
            <!-- front wheel outer -->
            <circle cx="165" cy="54" r="15" fill="#111" stroke="#333" stroke-width="2"/>
            <!-- front wheel hub + spokes -->
            <g class="wheel-inner" style="transform-box:fill-box;transform-origin:center">
              <circle cx="165" cy="54" r="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1.5"/>
              <line x1="165" y1="46" x2="165" y2="62" stroke="#383838" stroke-width="1.5"/>
              <line x1="157" y1="54" x2="173" y2="54" stroke="#383838" stroke-width="1.5"/>
              <line x1="159.3" y1="48.3" x2="170.7" y2="59.7" stroke="#383838" stroke-width="1.5"/>
              <line x1="170.7" y1="48.3" x2="159.3" y2="59.7" stroke="#383838" stroke-width="1.5"/>
            </g>
            <!-- rear wheel outer -->
            <circle cx="45" cy="54" r="15" fill="#111" stroke="#333" stroke-width="2"/>
            <!-- rear wheel hub + spokes -->
            <g class="wheel-inner" style="transform-box:fill-box;transform-origin:center">
              <circle cx="45" cy="54" r="8" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1.5"/>
              <line x1="45" y1="46" x2="45" y2="62" stroke="#383838" stroke-width="1.5"/>
              <line x1="37" y1="54" x2="53" y2="54" stroke="#383838" stroke-width="1.5"/>
              <line x1="39.3" y1="48.3" x2="50.7" y2="59.7" stroke="#383838" stroke-width="1.5"/>
              <line x1="50.7" y1="48.3" x2="39.3" y2="59.7" stroke="#383838" stroke-width="1.5"/>
            </g>
          </svg>
        </div>
        <div class="landing-road">
          <div class="road-dashes"></div>
        </div>
      </div>
      <div class="landing-loader">
        <div class="loader-track"><div class="loader-fill"></div></div>
        <p class="loader-label">Loading tour stops&hellip;</p>
      </div>
      <button id="landing-enter" class="landing-enter-btn">
        ENTER MAP
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="5 1 11 7 5 13"/>
        </svg>
      </button>
    </div>
  </div>

  <header id="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-dot" aria-hidden="true"></div>
        <div>
          <h1 class="header-title">Trunk Sale Tour '26</h1>
          <p class="header-sub">J. Cole &middot; The Fall-Off &middot; February 2026</p>
        </div>
      </div>
      <button id="toggle-list-btn" class="btn-outline" aria-expanded="false" aria-controls="stop-list">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <line x1="1" y1="4" x2="15" y2="4"/>
          <line x1="1" y1="8" x2="15" y2="8"/>
          <line x1="1" y1="12" x2="15" y2="12"/>
        </svg>
        All Stops
      </button>
    </div>
  </header>

  <main id="app">
    <div id="map" role="application" aria-label="Interactive map of J. Cole Trunk Sale Tour stops"></div>

    <!-- Stop List Drawer -->
    <div id="list-overlay" class="overlay" aria-hidden="true"></div>
    <aside id="stop-list" class="panel stop-list-panel" aria-label="Tour stops list" aria-hidden="true">
      <div class="panel-head">
        <span class="panel-head-title">All Stops</span>
        <button id="close-list-btn" class="btn-icon" aria-label="Close stop list">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="1" y1="1" x2="13" y2="13"/>
            <line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <p class="panel-sub">18 confirmed stops &middot; Feb 2026</p>
      <ul id="stop-items" role="list"></ul>
    </aside>

    <!-- City Guide Panel -->
    <aside id="city-guide" class="panel guide-panel" aria-label="City guide" aria-hidden="true">
      <button id="close-guide-btn" class="btn-icon btn-icon-top" aria-label="Close city guide">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="1" y1="1" x2="13" y2="13"/>
          <line x1="13" y1="1" x2="1" y2="13"/>
        </svg>
      </button>
      <div id="guide-content" class="guide-content"></div>
      <div id="guide-nav" class="guide-nav">
        <button id="prev-btn" class="nav-btn" aria-label="Previous stop">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 1 3 7 9 13"/>
          </svg>
          Prev
        </button>
        <span id="stop-indicator" class="stop-indicator" aria-live="polite"></span>
        <button id="next-btn" class="nav-btn" aria-label="Next stop">
          Next
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="5 1 11 7 5 13"/>
          </svg>
        </button>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
